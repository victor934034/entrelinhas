<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha | entre linhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap section-tight">
  <div style="max-width:460px;margin:0 auto">
    <h1>Crie uma nova senha.</h1>
    <form id="f" novalidate>
      <div class="field"><label for="s1">Nova senha <span class="hint">pelo menos 8 caracteres</span></label><input id="s1" type="password" autocomplete="new-password"><span class="msg">A senha precisa ter 8 caracteres ou mais.</span></div>
      <div class="field"><label for="s2">Repita a nova senha</label><input id="s2" type="password" autocomplete="new-password"><span class="msg">As senhas não são iguais.</span></div>
      <p class="form-erro" id="erro" role="alert"></p>
      <button class="btn btn-lg btn-block mt-1" type="submit" id="ok">Salvar e entrar</button>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/icons.js"></script><script src="js/covers.js"></script><script src="js/layout.js"></script>
<script>
  L.mount({ active: '' });
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') || '';
  const mark = (el, ok) => { el.closest('.field').classList.toggle('invalid', !ok); return ok; };
  if (!token) $('erro').textContent = 'Link inválido. Peça um novo em "Esqueci a senha" na tela de entrada.';
  $('f').onsubmit = async e => {
    e.preventDefault(); $('erro').textContent = '';
    const a = mark($('s1'), $('s1').value.length >= 8), b = mark($('s2'), $('s1').value === $('s2').value);
    if (!(a && b)) return;
    $('ok').disabled = true;
    try { await ER.api('POST', '/api/redefinir', { token, senha: $('s1').value }); L.toast('Senha alterada. Você já está dentro.'); setTimeout(() => { location.href = 'biblioteca.html'; }, 900); }
    catch (err) { $('erro').textContent = err.message; $('ok').disabled = false; }
  };
</script>
</body>
</html>
